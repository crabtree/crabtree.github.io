<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech@digitaltree.pl</title>

  <style>
    :root {
      --bg: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --text: #e5e5e5;
      --text-muted: #9a9a9a;
      --accent: #ff6a00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    header {
      padding: 4rem 1.5rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    section {
      background: var(--bg-secondary);
      padding: 2rem;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      border-left: 4px solid var(--accent);
    }

    section h2 {
      margin-bottom: 0.75rem;
      font-size: 1.4rem;
    }

    section p {
      color: var(--text-muted);
    }

    ul {
      list-style: none;
      margin-top: 0.5rem;
    }

    li {
      margin-bottom: 0.4rem;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>crabtree</h1>
    <p>
      Software Engineer
    </p>
  </header>

  <main>
    <section>
      <h2>About</h2>
      <p>
        Software Engineer specializing in cloud-native infrastructure, security, and automations. Passionate about networking, and building tools that simplify complex systems.
      </p>
    </section>

        <li><a href="#">Project Two</a> – short description</li>
        <li><a href="#">Project Three</a> – short description</li>
      </ul>

    -->

    <section>
      <h2>Contact</h2>
      <p>
        <a href="mailto:hello@digitaltree.pl">hello@digitaltree.pl</a><br />
        <a href="https://github.com/crabtree">GitHub</a> ·
        <a href="https://linkedin.com/in/krystian-cieslik">LinkedIn</a>
      </p>
    </section>
  </main>

  <footer>
    © 2025 crabtree
  </footer>

</body>
</html>
